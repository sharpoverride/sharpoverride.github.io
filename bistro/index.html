<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cămara Culinară</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta name="theme-color" content="#D65A31" />
    <link rel="apple-touch-icon" href="favicon.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- App CSS (Tailwind Precompiled) -->
    <link rel="stylesheet" href="css/app.min.css" />
    
    <!-- Custom Overrides for SPA Router and Transitions -->
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #FCFAFA;
            color: #2D3436;
        }
        .font-title {
            font-family: 'Libre Baskerville', serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FCFAFA;
        }
        ::-webkit-scrollbar-thumb {
            background: #E2E8F0;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #CBD5E1;
        }
    </style>
</head>
<body class="overflow-hidden">
    <div class="flex flex-col md:flex-row h-screen w-screen overflow-hidden">
        
        <!-- Mobile Top Nav -->
        <header class="md:hidden bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between z-20">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.hash='#/'">
                <div class="w-8 h-8 bg-accent rounded-full flex items-center justify-center text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
                        <line x1="6" x2="18" y1="17" y2="17"/>
                    </svg>
                </div>
                <h1 class="font-title text-base font-bold tracking-tight">Cămara <span class="text-accent">Culinară</span></h1>
            </div>
            
            <button id="mobile-menu-btn" class="p-2 text-gray-600 hover:text-accent focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
                </svg>
            </button>
        </header>

        <!-- Sidebar Navigation (Desktop & Mobile drawer) -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 flex-shrink-0 bg-white border-r border-gray-200 flex flex-col justify-between h-full z-30 transition-all duration-300 w-64">
            <div class="p-6 overflow-y-auto flex-1">
                <!-- Brand -->
                <div id="brand-area" class="flex items-center gap-3 mb-10 select-none cursor-pointer hover:opacity-80 transition-opacity" onclick="window.location.hash='#/'">
                    <div class="w-10 h-10 bg-accent rounded-full flex items-center justify-center text-white flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
                            <line x1="6" x2="18" y1="17" y2="17"/>
                        </svg>
                    </div>
                    <h1 id="brand-text" class="font-title text-xl font-bold tracking-tight">Cămara<br/><span class="text-accent">Culinară</span></h1>
                </div>

                <!-- Nav Items -->
                <nav class="space-y-2">
                    <a href="#/" id="nav-home" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 transition-colors text-gray-700 font-medium">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        <span class="nav-text">Acasă</span>
                    </a>
                    <a href="#/recipes/new" id="nav-new" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 transition-colors text-gray-700 font-medium">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/>
                        </svg>
                        <span class="nav-text">Rețetă Nouă</span>
                    </a>
                    <a href="#/favorites" id="nav-favorites" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 transition-colors text-gray-700 font-medium">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                        </svg>
                        <span class="nav-text">Favorite</span>
                    </a>
                    <a href="#/local-changes" id="nav-changes" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 transition-colors text-gray-700 font-medium">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                        </svg>
                        <span class="nav-text">Modificări Locale</span>
                    </a>

                    <!-- Cuisine Categories Area -->
                    <div id="categories-area" class="pt-4 mt-4 border-t border-gray-100 hidden">
                        <h3 class="nav-text px-4 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">Categorii</h3>
                        <div id="categories-list" class="space-y-1"></div>
                    </div>
                </nav>
            </div>

            <!-- Chef's Tip Card -->
            <div id="tip-area" class="p-6">
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-100">
                    <h4 class="font-title font-bold text-sm mb-2">Sfatul Bucătarului</h4>
                    <p id="tip-text" class="text-xs text-gray-500 leading-relaxed">Se încarcă sfatul...</p>
                </div>
            </div>
        </aside>

        <!-- Sidebar Overlay (Mobile) -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-25 hidden md:hidden"></div>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-6 md:p-10 relative">
            <div id="app-view" class="max-w-7xl mx-auto h-full">
                <!-- Content will be injected here dynamically by app.js -->
            </div>
        </main>
    </div>

    <!-- Wistia/PWA Loaders or Modals if needed -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden"></div>

    <!-- Wake Lock & Image Upload helper scripts -->
    <script src="js/wakelock.js"></script>
    
    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
