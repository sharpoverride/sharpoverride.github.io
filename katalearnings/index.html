<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      content="Katabench Paths — curated, sourced learning paths for system design, foundations, distributed systems, data and the .NET stack."
    />
    <title>Katabench Paths</title>
    <script>
      // Single Page Apps for GitHub Pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        var root = document.documentElement
        var theme = 'dark'
        try {
          var stored = window.localStorage.getItem('app:theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (error) {
          /* Storage may be unavailable; the dark default is fine. */
        }
        root.classList.remove('light', 'dark')
        root.classList.add(theme)
        root.style.colorScheme = theme
      })()
    </script>

  </head>
  <body>
    <div id="root"></div>
  </body>
